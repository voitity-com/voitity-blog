name: Validate Blog

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        env:
          CI: "true"
          SITE_URL: https://blog.bigmelo.com
        run: |
          test -n "$PUBLIC_GA4_MEASUREMENT_ID"
          npm run build

      - name: Verify required output
        run: |
          test -f dist/es/index.html
          test -f dist/en/index.html
          test -f dist/es/articulos/que-es-bigmelo/index.html
          test -f dist/en/articles/what-is-bigmelo/index.html
          test -f dist/rss.xml
          test -f dist/sitemap-index.xml
          test -f dist/404.html
          grep --fixed-strings --quiet "data-measurement-id=\"$PUBLIC_GA4_MEASUREMENT_ID\"" dist/es/index.html
